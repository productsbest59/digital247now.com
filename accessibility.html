/* =============================
   DIGITAL 247 NOW - CLEAN FINAL CSS
   ============================= */

:root {
  --bg: #0a0a0e;
  --bg-glass: rgba(255,255,255,0.04);
  --bg-glass2: rgba(255,255,255,0.08);
  --gold-dark: #d4af37;
  --gold-light: #f4d06f;
  --text-main: #f1f1f1;
  --text-muted: #bfbfbf;
  --border: rgba(212,175,55,0.25);
  --shadow-soft: 0 15px 40px rgba(0,0,0,0.40);
  --shadow-strong: 0 25px 80px rgba(0,0,0,0.65);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  font-family: Arial, sans-serif;
  color: var(--text-main);
  line-height: 1.75;
  background:
  linear-gradient(rgba(10,10,14,.88), rgba(10,10,14,.94)),
  url("digital-bg.jpg") center top / cover fixed no-repeat;
}

h1, h2, h3,
.hero-title,
.section-title,
.package-card h3,
.card h3,
nav a,
.lang-toggle,
.package-btn,
.btn {
  font-family: Arial, sans-serif !important;
}



/* ---------------- HEADER - FINAL CLEAN ---------------- */
header.premium-site-header{
  position:absolute;
  top:16px;
  left:50%;
  right:auto;
  transform:translateX(-50%);

  width:clamp(760px, 58vw, 900px);
  max-width:calc(100% - 96px);
  min-height:78px;
  padding:10px 18px;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(8,8,10,.74);
  border:1px solid rgba(212,175,55,.62);
  border-radius:24px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  box-shadow:
    0 10px 34px rgba(0,0,0,.38),
    0 0 18px rgba(212,175,55,.10);
}

header.premium-site-header .logo{
  position:relative;
  z-index:10000;
}

header.premium-site-header .logo img{
  width:auto;
  max-width:290px;
  height:58px;
  max-height:58px;
  margin-top:0;
  display:block;
  filter:drop-shadow(0 0 14px rgba(212,175,55,.28));
}

header.premium-site-header .hamburger{
  position:absolute;
  top:50%;
  left:18px;
  right:auto;
  transform:translateY(-50%);

  width:52px;
  height:52px;

  border-radius:16px;
  border:1px solid rgba(212,175,55,.78);

  background:#09090b;
  color:#f4d06f;

  font-size:27px;
  font-weight:900;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:10001;

  box-shadow:
    0 0 16px rgba(212,175,55,.12),
    0 8px 22px rgba(0,0,0,.42);
}

html[lang="he"] header.premium-site-header .hamburger{
  left:18px;
  right:auto;
}

html[lang="en"] header.premium-site-header .hamburger{
  right:18px;
  left:auto;
}

header.premium-site-header .lang-toggle{
  position:absolute;
  top:50%;
  right:18px;
  left:auto;
  transform:translateY(-50%);

  min-width:88px;
  width:auto;
  height:42px;
  padding:0 11px;

  border-radius:14px;
  border:1px solid rgba(212,175,55,.78);

  background:#09090b;
  color:#f4d06f;

  font-family:Arial, sans-serif;
  font-size:.78rem;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;

  box-shadow:
    0 0 16px rgba(212,175,55,.12),
    0 8px 22px rgba(0,0,0,.42);
}

html[lang="he"] header.premium-site-header .lang-toggle{
  right:18px;
  left:auto;
}

html[lang="en"] header.premium-site-header .lang-toggle{
  left:18px;
  right:auto;
}

header.premium-site-header .lang-toggle:hover,
header.premium-site-header .hamburger:hover{
  transform:translateY(-50%) translateY(-2px);
}

header.premium-site-header .main-nav{
  position:absolute;
  top:88px;
  left:18px;
  right:auto;

  min-width:230px;

  display:none;
  flex-direction:column;
  gap:12px;

  padding:18px;
  border-radius:22px;

  background:rgba(10,10,14,0.96);
  border:1px solid var(--border);
  box-shadow:var(--shadow-strong);

  z-index:10000;
}

html[lang="en"] header.premium-site-header .main-nav{
  right:18px;
  left:auto;
}

header.premium-site-header .main-nav.open{
  display:flex;
}

header.premium-site-header .main-nav a{
  width:100%;
  text-align:center;
  font-family:Arial, sans-serif;
  color:var(--text-main);
  font-weight:700;
  font-size:.95rem;
  padding:9px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(212,175,55,.22);
  box-shadow:0 0 14px rgba(0,0,0,.22);
  transition:.25s;
  text-decoration:none;
}

header.premium-site-header .main-nav a:hover{
  color:#111;
  background:linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  border-color:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 0 22px rgba(244,208,111,.28);
}

/* ---------------- HERO ---------------- */

.hero {
  min-height: 88vh;
  padding: 130px 6% 55px;
  background: transparent !important;
  display: flex;
  justify-content: center;
}

.hero-inner {
  max-width: 1000px;
  width: 100%;
  padding: 30px 26px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-strong);
  border-radius: 32px;
  text-align: center;
}

.hero-title {
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 700;
  letter-spacing: 0;
  color: var(--gold-light);
  margin-bottom: 18px;
  text-shadow: none;
}

.hero-sub {
  color: var(--text-muted);
  font-size: 1.15rem;
  max-width: 700px;
  margin: auto;
}

.hero-buttons {
  margin-top: 26px;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.hero-real-buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-top:20px;
}

.hero-real-buttons a{
  text-decoration:none;
}

.btn {
  padding: 14px 26px;
  border-radius: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.25s;
  position: relative;
  overflow: hidden;
}

.btn:hover { transform: translateY(-2px); }

.btn-primary {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  color: #111;
}

.btn-secondary {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text-main);
}

/* Shine */
.btn::after {
  content: "";
  position: absolute;
  top: -40%;
  width: 30px;
  height: 180%;
  background: rgba(255,255,255,0.3);
  transform: rotate(22deg);
  left: -60px;
  transition: 0.4s;
}

.btn:hover::after { left: calc(100% + 60px); }

/* Hero image */
.hero-image-frame {
  margin: 22px auto 0;
  width: min(52%, 560px);
  border-radius: 22px;
  padding: 8px;
  background: var(--bg-glass2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
}

.hero-image-frame img {
  width: 100%;
  height: auto;
  border-radius: 16px;
  display: block;
}

/* Mobile replacement hero */
.mobile-hero-img,
.mobile-he,
.mobile-en{
  display:none;
}

.trust-banner{
  width:min(620px,95%);
  margin:8px auto -20px;
  display:none;
}

html[lang="he"] .trust-banner-he{
  display:block;
}

html[lang="en"] .trust-banner-en{
  display:block;
}

/* ---------------- SECTIONS ---------------- */
section {
  padding: 56px 6%;
}

.section-title {
  font-size: clamp(1.8rem, 4vw, 3rem);
  text-align: center;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--gold-light);
  margin-bottom: 30px;
  text-shadow: none;
}

/* ---------------- CARDS / SERVICES ---------------- */
.services-grid,
.packages-grid,
.process-grid,
.testimonials-grid,
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 24px;
}

.packages-grid {
  grid-template-columns: repeat(auto-fit,minmax(290px,1fr));
}

.portfolio-grid {
  grid-template-columns: repeat(auto-fit,minmax(310px,1fr));
}

.card,
.package-card,
.testimonial-card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px;
  box-shadow: var(--shadow-soft);
  transition: 0.25s;
}

.package-card {
  border-radius: 26px;
  padding: 28px;
}

.card:hover,
.package-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-strong);
}

.package-card:hover {
  border-color: var(--gold-light);
}

.card h3 {
  font-size: 1.3rem;
  color: var(--gold-dark);
  margin-bottom: 12px;
}

.card p,
.package-card p {
  color: var(--text-muted);
}

.package-card h3 {
  color: var(--text-main);
  margin-bottom: 8px;
  font-size: 1.6rem;
}

.package-card ul {
  list-style: none;
  margin: 18px 0;
  padding: 0;
}

.package-card li {
  margin-bottom: 6px;
  color: var(--text-main);
}

.package-card li::before {
  content: "✓ ";
  color: var(--gold-light);
  font-weight: 900;
}

.package-btn {
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 700;
  background: linear-gradient(135deg,var(--gold-dark),var(--gold-light));
  color: #111;
  display: inline-block;
  margin-top: 12px;
}

/* ---------------- PORTFOLIO ---------------- */
.site-preview {
  height: 220px;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid var(--border);
  margin-bottom: 14px;
  direction: ltr;
}

.site-preview iframe {
  direction: ltr;
  width: 1200px;
  height: 900px;
  transform: scale(0.28);
  transform-origin: top left;
  border: 0;
  display: block;
}

/* ---------------- PROCESS ---------------- */
.step {
  text-align: center;
}

.step span {
  display: inline-flex;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: var(--gold-light);
  color: #111;
  font-weight: 900;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}

.step h3 {
  color: var(--gold-dark);
}

/* ---------------- TESTIMONIALS ---------------- */
.testimonial-card .stars {
  color: var(--gold-light);
  margin-bottom: 10px;
}

/* ---------------- FAQ ---------------- */
.faq-clean {
  max-width: 850px;
  margin: 0 auto;
  display: grid;
  gap: 16px;
}

.faq-clean details {
  background: rgba(255,255,255,0.055);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}

.faq-clean summary {
  cursor: pointer;
  padding: 20px 24px;
  font-weight: 700;
  color: var(--gold-light);
  list-style: none;
  font-family: Arial, sans-serif !important;
}

.faq-clean summary::-webkit-details-marker {
  display: none;
}

.faq-clean summary::after {
  content: "+";
  float: left;
  font-size: 1.5rem;
  line-height: 1;
}

html[dir="ltr"] .faq-clean summary::after {
  float: right;
}

.faq-clean details[open] summary::after {
  content: "−";
}

.faq-clean p {
  padding: 0 24px 22px;
  color: #d8ecff;
  line-height: 1.8;
  font-weight: 500;
  font-family: Arial, sans-serif !important;
}

/* ---------------- CONTACT ---------------- */
.contact-wrap {
  max-width: 700px;
  margin: auto;
  background: var(--bg-glass);
  padding: 30px;
  border-radius: 26px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
}

form{
  display:grid;
  gap:18px;
}

input,
textarea{
  width:100%;
  border-radius:16px;

  font-size:1rem;

}

input::placeholder,
textarea::placeholder{

input[type="tel"]{

textarea{

}

form button{

}

body.large-text { font-size: 120%; }

/* ---------------- FOOTER ---------------- */
footer {

footer a {

<script>
/* CONTACT FORM */
const contactForm = document.getElementById("contactForm");
if (contactForm) {
  contactForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = this;
    const data = new FormData(form);
    const msg = document.getElementById("formMessage");

    if (msg) msg.style.display = "none";

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { "Accept": "application/json" }
      });

      if (msg) {
        msg.innerText = response.ok ? "הפנייה נשלחה בהצלחה" : "אירעה שגיאה. נסה שוב.";
        msg.style.display = "block";
      }
      if (response.ok) form.reset();
    } catch (error) {
      if (msg) {
        msg.innerText = "אירעה שגיאה. נסה שוב.";
        msg.style.display = "block";
      }
    }
  });
}

/* LANGUAGE */
let lang = "he";

function toggleLang() {
  lang = (lang === "he" ? "en" : "he");
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "he" ? "rtl" : "ltr");

  document.querySelectorAll("[data-he]").forEach(el => {
    el.innerHTML = el.getAttribute(`data-${lang}`);
  });

  const langBtn = document.querySelector(".lang-toggle");
  if (langBtn) langBtn.innerText = (lang === "he" ? "English" : "עברית");

  document.querySelectorAll("[data-placeholder-he]").forEach(el => {
    el.placeholder = el.getAttribute(`data-placeholder-${lang}`);
  });
}

function toggleMenu() {
  const nav = document.getElementById("mainNav");
  if (nav) nav.classList.toggle("open");
}

document.addEventListener("click", function(e) {
  const nav = document.getElementById("mainNav");
  const burger = document.querySelector(".hamburger");

  if (nav && burger && !nav.contains(e.target) && !burger.contains(e.target)) {
    nav.classList.remove("open");
  }
});

document.querySelectorAll("#mainNav a").forEach(link => {
  link.addEventListener("click", () => {
    const nav = document.getElementById("mainNav");
    if (nav) nav.classList.remove("open");
  });
});

function toggleAccess() {
  const panel = document.getElementById("accessPanel");
  if (panel) panel.style.display = (panel.style.display === "block" ? "none" : "block");
}

function resetAccess() {
  document.body.classList.remove("large-text", "high-contrast", "highlight-links", "readable-font", "bold-text");
  const panel = document.getElementById("accessPanel");
  if (panel) panel.style.display = "none";
}

document.addEventListener("click", e => {
  const panel = document.getElementById("accessPanel");
  const btn = document.querySelector(".float-access");

  if (panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.style.display = "none";
  }
});

document.addEventListener("DOMContentLoaded", () => {
  if (document.documentElement.lang === "he") {
    document.querySelectorAll("[data-he]").forEach(el => {
      el.innerHTML = el.getAttribute("data-he");
    });
  }
  swapHeroImage();
});

function swapHeroImage() {
  const hero = document.getElementById("heroImage");
  if (!hero) return;
  const isHebrew = document.documentElement.lang === "he";
  hero.src = isHebrew ? "hero-premium.png" : "hero-premium-en.png";
}
</script>
