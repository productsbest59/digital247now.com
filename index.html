/* =============================
   PREMIUM DARK-GOLD DESIGN
   ============================= */

:root {
  --bg: #0a0a0e;
  --bg-glass: rgba(255,255,255,0.04);
  --bg-glass2: rgba(255,255,255,0.08);
  --gold-dark: #d4af37;
  --gold-light: #f4d06f;
  --text-main: #f1f1f1;
  --text-muted: #bfbfbf;
  --border: rgba(212,175,55,0.25);
  --shadow-soft: 0 15px 40px rgba(0,0,0,0.40);
  --shadow-strong: 0 25px 80px rgba(0,0,0,0.65);
}

* { margin:0; padding:0; box-sizing:border-box; }
body,html { width:100%; overflow-x:hidden; }
body {
  background: var(--bg);
  font-family: 'Heebo', sans-serif;
  color: var(--text-main);
  line-height: 1.75;
}

/* ---------------- HEADER ---------------- */
header {
  position: sticky;
  top: 0;
  z-index: 999;
  padding: 15px 6%;
  background: rgba(10,10,14,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  width: 210px;
  filter: drop-shadow(0 0 12px rgba(212,175,55,0.22));
}

nav {
  display: flex;
  gap: 32px;
}

nav a {
  color: var(--text-main);
  font-weight: 700;
  font-size: 0.95rem;
  transition: 0.25s;
}
nav a:hover { color: var(--gold-light); }

/* Lang toggle */
.lang-toggle {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  color: #111;
  border: none;
  padding: 10px 22px;
  border-radius: 999px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(244,208,111,0.25);
  transition: 0.25s;
}
.lang-toggle:hover {
  transform: translateY(-2px);
}

/* ---------------- HERO ---------------- */

.hero {
  min-height: 88vh;
  padding: 70px 6% 60px;
  background:
    linear-gradient(rgba(10,10,14,.72), rgba(10,10,14,.82)),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  display: flex;
  justify-content: center;
}

.hero-inner {
  max-width: 1000px;
  width: 100%;
  padding: 34px 28px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow-strong);
  border-radius: 32px;
  text-align: center;
}

.hero-title {
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 900;
  color: var(--gold-light);
  margin-bottom: 20px;
}

.hero-sub {
  color: var(--text-muted);
  font-size: 1.15rem;
  max-width: 700px;
  margin: auto;
}

.hero-buttons {
  margin-top: 32px;
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.btn {
  padding: 14px 26px;
  border-radius: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.25s;
  position: relative;
  overflow: hidden;
}

.btn:hover { transform: translateY(-2px); }

.btn-primary {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  color: #111;
}
.btn-secondary {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text-main);
}

/* Shine */
.btn::after {
  content: "";
  position: absolute;
  top: -40%;
  width: 30px;
  height: 180%;
  background: rgba(255,255,255,0.3);
  transform: rotate(22deg);
  left: -60px;
  transition: 0.4s;
}
.btn:hover::after { left: calc(100% + 60px); }

/* Hero image */
.hero-image-frame {
  margin: 40px auto 0;
  width: 60%;
  border-radius: 26px;
  padding: 18px;
  background: var(--bg-glass2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
}
.hero-image-frame img {
  width: 100%;
  border-radius: 18px;
}

/* Trust badges */
.trust-badges {
  display: flex;
  justify-content: center;
  margin-top: 26px;
  gap: 12px;
  flex-wrap: wrap;
}

.trust-badges span {
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--bg-glass2);
  border: 1px solid var(--border);
  color: var(--gold-light);
  font-weight: 700;
  font-size: 0.9rem;
}

/* ---------------- SECTIONS ---------------- */
section { padding: 90px 6%; }
.section-title {
  font-size: clamp(1.8rem, 4vw, 3rem);
  text-align: center;
  font-weight: 900;
  color: var(--gold-light);
  margin-bottom: 42px;
}

/* ---------------- SERVICES ---------------- */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 26px;
}

.card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 26px;
  box-shadow: var(--shadow-soft);
  transition: 0.25s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-strong);
}
.card h3 {
  font-size: 1.3rem;
  color: var(--gold-dark);
  margin-bottom: 12px;
}
.card p {
  color: var(--text-muted);
}

/* ---------------- PACKAGES ---------------- */
.packages-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(290px,1fr));
  gap: 26px;
}

.package-card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 30px;
  box-shadow: var(--shadow-soft);
  transition: 0.25s;
}
.package-card:hover {
  transform: translateY(-6px);
  border-color: var(--gold-light);
}

.package-card h3 {
  color: var(--text-main);
  margin-bottom: 8px;
  font-size: 1.6rem;
}
.package-card p {
  color: var(--text-muted);
}
.package-card ul {
  list-style: none;
  margin: 18px 0;
  padding: 0;
}
.package-card li {
  margin-bottom: 6px;
  color: var(--text-main);
}
.package-card li::before {
  content: "✓ ";
  color: var(--gold-light);
  font-weight: 900;

.package-btn {

  display: inline-block;
  margin-top: 12px;

/* ---------------- PORTFOLIO ---------------- */
.portfolio-grid {

.site-preview {

.site-preview iframe {

  border: 0;
  display: block;
}
/* ---------------- PROCESS ---------------- */
.process-grid {

  gap: 26px;
}

.step {

}
.step span {

/* ---------------- TESTIMONIALS ---------------- */
.testimonials-grid {

.testimonial-card {

/* ---------------- FAQ ---------------- */
.faq-grid {

.faq-answer {

/* ---------------- CONTACT ---------------- */

body.high-contrast {

/* ---------------- FOOTER ---------------- */

}

</style>

<script>

/* LANGUAGE */
let lang = "he";

function toggleLang() {
  lang = (lang === "he" ? "en" : "he");
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "he" ? "rtl" : "ltr");

  document.querySelectorAll("[data-he]").forEach(el => {
    el.innerHTML = el.getAttribute(`data-${lang}`);
  });

  document.querySelector(".lang-toggle").innerText =
    (lang === "he" ? "English" : "עברית");
}

/* FAQ */
function setFAQ(id) {
  const data = {
    1: {
      heTitle: "01 / זמני בנייה",
      enTitle: "01 / Timeline",
      heText: "פרויקטים מהירים תלויים במוכנות חומרים. אתרים מורכבים דורשים זמן איכות.",
      enText: "Fast builds depend on content readiness. Complex websites require more time."
    },
    2: {
      heTitle: "02 / SEO",
      enTitle: "02 / SEO",
      heText: "כל אתר נבנה עם בסיס SEO חזק: מהירות, מבנה נכון ומטא‑דאטה.",
      enText: "Every website includes a strong SEO foundation: speed, structure, metadata."
    },
    3: {
      heTitle: "03 / מובייל",
      enTitle: "03 / Mobile",
      heText: "כל אתר מותאם למובייל בצורה מלאה וברורה.",
      enText: "Fully mobile‑optimized for clarity and usability."
    },
    4: {
      heTitle: "04 / שפות",
      enTitle: "04 / Languages",
      heText: "תמיכה מלאה בעברית ובאנגלית עם כפתור החלפת שפה.",
      enText: "Full Hebrew + English support with a clean language toggle."
    },
    5: {
         heTitle: "05 / וואטסאפ",
      enTitle: "05 / WhatsApp",
      heText: "ניתן להוסיף כפתור וואטסאפ צף המחובר ישירות למספר העסק.",
      enText: "A floating WhatsApp button can be connected directly to your business number."
    },
    6: {
      heTitle: "06 / מחירים",
      enTitle: "06 / Pricing",
      heText: "המחיר נקבע לפי מורכבות העבודה: עיצוב, פיתוח, SEO ותוכן.",
      enText: "Pricing depends on project scope: design, development, SEO and content."
    }
  };

  const block = data[id];
  const titleEl = document.getElementById("faq-title");
  const textEl = document.getElementById("faq-text");

  if (titleEl && textEl) {
    titleEl.innerHTML = (lang === "he" ? block.heTitle : block.enTitle);
    textEl.innerHTML = (lang === "he" ? block.heText : block.enText);
  }
}

/* ===========================
   ACCESSIBILITY
=========================== */

function toggleAccess() {
  const panel = document.getElementById("accessPanel");
  panel.style.display = (panel.style.display === "block" ? "none" : "block");
}

function resetAccess() {
  document.body.classList.remove(
    "large-text",
    "high-contrast",
    "highlight-links",
    "readable-font",
    "bold-text"
  );

  const panel = document.getElementById("accessPanel");
  if (panel) panel.style.display = "none";
}

/* סגירה אוטומטית בלחיצה בחוץ */
document.addEventListener("click", e => {
  const panel = document.getElementById("accessPanel");
  const btn = document.querySelector(".float-access");

  if (panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.style.display = "none";
  }
});

/* טעינת עברית כברירת מחדל */
document.addEventListener("DOMContentLoaded", () => {
  if (document.documentElement.lang === "he") {
    document.querySelectorAll("[data-he]").forEach(el => {
      el.innerHTML = el.getAttribute("data-he");
    });
  }
});
</script>
