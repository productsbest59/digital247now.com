  msg.style.display = "none";

  try {
    const response = await fetch(form.action, {
      method: "POST",
      body: data,
      headers: {
        "Accept": "application/json"
      }
    });

    if (response.ok) {
      msg.innerText = "הפנייה נשלחה בהצלחה";
      msg.style.display = "block";
      form.reset();
    } else {
      msg.innerText = "אירעה שגיאה. נסה שוב.";
      msg.style.display = "block";
    }

  } catch (error) {

});
